name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        # No submodules — CE build skips them entirely

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CE server image
        run: |
          docker build \
            --build-arg EDITION=CE \
            -t ghcr.io/aicser-platform/open-aicser-server:ce-${{ github.sha }} \
            ./server

      - name: Build CE client image
        run: |
          docker build \
            --build-arg EDITION=CE \
            -t ghcr.io/aicser-platform/open-aicser-client:ce-${{ github.sha }} \
            ./client

      - name: Push CE images
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/aicser-platform/open-aicser-server:ce-${{ github.sha }}
          docker push ghcr.io/aicser-platform/open-aicser-client:ce-${{ github.sha }}

  build-ee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.EE_SUBMODULE_TOKEN }}
          # GitHub PAT with read access to both private EE repos

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build EE server image
        run: |
          docker build \
            --build-arg EDITION=EE \
            -t ghcr.io/aicser-platform/open-aicser-server:ee-${{ github.sha }} \
            ./server

      - name: Build EE client image
        run: |
          docker build \
            --build-arg EDITION=EE \
            -t ghcr.io/aicser-platform/open-aicser-client:ee-${{ github.sha }} \
            ./client

      - name: Push EE images
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/aicser-platform/open-aicser-server:ee-${{ github.sha }}
          docker push ghcr.io/aicser-platform/open-aicser-client:ee-${{ github.sha }}
